[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_thickets_repro"
version = "0.1.0"
description = "Gate-0 scaffold for reproducing Neural Thickets (arXiv:2603.12228) Section 5.2"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
