# Capability Benchmark Gate: attribute_recognition (Visual Genome attributes). Base-model,
# ZERO perturbation evaluation only -- see CAPABILITY_BENCHMARK_GATE.md for the full design
# log, including why a drawn bounding-box marker is part of this benchmark's own protocol,
# and the ranjaykrishna/visual_genome -> mikewang/vaw source migration (the original repo's
# script-based loading fails on modern `datasets`, confirmed on a real RunPod this session).

experiment: capability_benchmark_gate_attribute_recognition

model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
  architecture: Qwen2_5_VLForConditionalGeneration
  precision: bfloat16

reproducibility:
  global_seed: 42

hardware:
  min_free_disk_gb: 25

generation:
  decoding: greedy
  max_tokens: 16                                        # a single word/short phrase attribute

dataset:
  capability: attribute_recognition
  adapter: neural_thickets_repro.benchmarks.adapters.attribute_recognition_visualgenome.VisualGenomeAttributeBenchmark
  # NOTE: unlike the HF-repo-id "source" fields in most other capability configs, this
  # adapter reads a LOCALLY PREPARED artifact (see prepare_visual_genome_data.py) -- this is
  # a DIRECTORY PATH (external/RandOpt/data/visual_genome), relative to the repo root when
  # run via `python -m ...` from there, matching the GQA configs' own path-not-repo-id
  # convention. Annotations come from mikewang/vaw; images from Visual Genome's own official
  # archives (fetched by the prepare script) -- see that script's module docstring for the
  # UNCONFIRMED archive-URL caveat.
  source: external/RandOpt/data/visual_genome
  revision: null                                        # not applicable -- see prepare_visual_genome_data.py for provenance instead
  split: train                                           # mikewang/vaw split the prepare script draws its candidate pool from
  subset_size: 200
  deviation_reason: null
  subset_selection_rule: shuffled_prefix
  subset_seed: 42

gates:
  max_parser_failure_rate_pass: 0.02
  max_parser_failure_rate_needs_review: 0.10
  image_sanity_min_gap_pass: 0.05
  image_sanity_subset_size: 40
  floor_ceiling_low: 0.05
  floor_ceiling_high: 0.95
