[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thickets-or-tilts"
version = "1.0.0"
description = "What does random weight search buy? A pre-registered re-examination of RandOpt / Neural Thickets"
readme = "README.md"
license = {text = "MIT (code); CC BY 4.0 (paper and results)"}
authors = [{name = "Karthik Yeluripati"}]
keywords = ["RandOpt", "neural thickets", "random weight perturbation", "self-consistency", "prompt selection", "pre-registration"]
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.24", "pandas", "scipy", "matplotlib"]

[project.urls]
Repository = "https://github.com/karthikyeluripati/thickets"
"Neural Thickets" = "https://arxiv.org/abs/2603.12228"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gpu = ["vllm==0.11.0", "transformers==4.57.1", "huggingface-hub==0.36.2", "datasets==3.6.0", "accelerate", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"
