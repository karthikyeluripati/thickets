[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thicket-runtime-lab"
version = "0.1.0"
description = "Correctness-first candidate lifecycle profiling for weight-space search"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
hf = ["transformers>=4.51,<5", "safetensors>=0.4"]
vllm = ["vllm==0.10.2", "ray[default]==2.49.2", "transformers==4.56.2"]

[project.scripts]
thicket-profile = "thicket_runtime.cli:main"
thicket-profile-vllm = "thicket_runtime.vllm_profile:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
