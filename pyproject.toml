[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thickets-or-tilts"
version = "0.2.0"
description = "Pre-registered re-examination of random weight perturbation (RandOpt / Neural Thickets) as post-training"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.24", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gpu = ["vllm==0.11.0", "transformers==4.57.1", "huggingface-hub==0.36.2", "datasets==3.6.0", "accelerate", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"
