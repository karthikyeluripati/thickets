name: runtime-baseline-tests
on:
  push:
    branches: [research/candidate-runtime-baseline]
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: pytest -q
